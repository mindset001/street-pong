<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Street Pong — 3D Table Tennis</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23ffa51f'/%3E%3C/svg%3E">
</head>
<body>
  <canvas id="gl"></canvas>

  <header id="topbar" hidden>
    <a class="brand" href="#/">STREET<b>PONG</b></a>
    <nav>
      <a href="#/" data-nav="home">Play</a>
      <a href="#/competitions" data-nav="competitions">Competitions</a>
      <a href="#/leaderboard" data-nav="leaderboard">Leaderboard</a>
    </nav>
    <div class="me">
      <span id="net-dot" class="dot" title="connection"></span>
      <a id="me-link" href="#/"></a>
      <button id="mute" class="icon" title="Toggle sound">🔊</button>
      <button id="logout" class="ghost">Log out</button>
    </div>
  </header>

  <main id="view"></main>

  <div id="hud" hidden>
    <div class="scoreboard">
      <div class="side" id="hud-p0"><span class="name"></span><span class="pts">0</span></div>
      <div class="mid">first to <span id="hud-target">11</span></div>
      <div class="side" id="hud-p1"><span class="pts">0</span><span class="name"></span></div>
    </div>
    <div id="hud-msg"></div>
    <button id="hud-leave" class="ghost">Forfeit</button>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal" hidden></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
